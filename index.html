<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דיווח נכסל משוב</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 1.4rem;
      color: #1f2937;
      margin-top: 0;
      text-align: center;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .status-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-green { background-color: #10b981; }
    .btn-blue { background-color: #3b82f6; }
    .btn-gray { background-color: #6b7280; }
    
    #other-container {
      display: none;
      margin-top: 12px;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
    #message {
      margin-top: 16px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="card" id="form-card">
    <h1>📝 דיווח נכסל משוב</h1>
    
    <label for="name">שם מלא:</label>
    <input type="text" id="name" placeholder="הכנס את שמך..." required>

    <label>בחר סטטוס:</label>
    <div class="status-buttons">
      <button class="btn btn-green" onclick="handleStatusClick('🏠 בבית')">🏠 בבית</button>
      <button class="btn btn-blue" onclick="handleStatusClick('🛡️ בבסיס')">🛡️ בבסיס</button>
      <button class="btn btn-gray" onclick="toggleOtherInput()">✏️ אחר</button>
    </div>

    <!-- שדה שיופיע רק אם לוחצים על 'אחר' -->
    <div id="other-container">
      <label for="custom-text">פירוט סטטוס אחר:</label>
      <input type="text" id="custom-text" placeholder="רשום כאן את הסטטוס שלך...">
      <button class="btn btn-gray" onclick="submitCustomStatus()">שלח דיווח</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    // הדבק כאן את ה-Web App URL המעודכן שלך שעבד
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWl0rdkfv2kLShATXaeXX0R3ZPQ2T3xlRArnC1SVSf36xK4oXdOxvVQTOqD6tW0x7gcQ/exec';

    function toggleOtherInput() {
      const container = document.getElementById('other-container');
      const isVisible = container.style.display === 'block';
      container.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) {
        document.getElementById('custom-text').focus();
      }
    }

    function handleStatusClick(status) {
      document.getElementById('other-container').style.display = 'none';
      submitStatus(status);
    }

    function submitCustomStatus() {
      const customText = document.getElementById('custom-text').value.trim();
      if (!customText) {
        alert('אנא הזן פירוט עבור סטטוס "אחר"');
        return;
      }
      submitStatus('אחר: ' + customText);
    }

    async function submitStatus(status) {
      const nameInput = document.getElementById('name');
      const name = nameInput.value.trim();
      const messageDiv = document.getElementById('message');
      const card = document.getElementById('form-card');

      if (!name) {
        alert('אנא הזן את שמך לפני לחיצה על הסטטוס');
        nameInput.focus();
        return;
      }

      card.classList.add('loading');
      messageDiv.style.display = 'none';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, status: status })
        });

        card.classList.remove('loading');
        messageDiv.className = 'success';
        messageDiv.innerHTML = '✅ הדיווח נשלח בהצלחה!';
        messageDiv.style.display = 'block';

        // איפוס הטופס לאחר 2 שניות
        setTimeout(() => { 
          nameInput.value = '';
          document.getElementById('custom-text').value = '';
          document.getElementById('other-container').style.display = 'none';
        }, 2000);

      } catch (err) {
        card.classList.remove('loading');
        messageDiv.className = 'error';
        messageDiv.innerHTML = '❌ אירעה שגיאה בשליחה. נסה שוב.';
        messageDiv.style.display = 'block';
      }
    }
  </script>

</body>
</html>
