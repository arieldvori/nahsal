<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דיווח סטטוס חירום</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 1.4rem;
      color: #1f2937;
      margin-top: 0;
      text-align: center;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .status-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-green { background-color: #10b981; }
    .btn-yellow { background-color: #f59e0b; }
    .btn-red { background-color: #ef4444; }
    
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
    #message {
      margin-top: 16px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="card" id="form-card">
    <h1>🚨 דיווח סטטוס חירום</h1>
    
    <label for="name">שם מלא:</label>
    <input type="text" id="name" placeholder="הכנס את שמך..." required>

    <label>בחר סטטוס:</label>
    <div class="status-buttons">
      <button class="btn btn-green" onclick="submitStatus('🏠 בבית / מוגן')">🏠 בבית / מוגן</button>
      <button class="btn btn-yellow" onclick="submitStatus('🛡️ בדרך למרחב מוגן')">🛡️ בדרך למרחב מוגן</button>
      <button class="btn btn-red" onclick="submitStatus('⚠️ זקוק לעזרה!')">⚠️ זקוק לעזרה!</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    // הוסף כאן את ה-URL מ-Google Apps Script
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWl0rdkfv2kLShATXaeXX0R3ZPQ2T3xlRArnC1SVSf36xK4oXdOxvVQTOqD6tW0x7gcQ/exec';

    async function submitStatus(status) {
      const nameInput = document.getElementById('name');
      const name = nameInput.value.trim();
      const messageDiv = document.getElementById('message');
      const card = document.getElementById('form-card');

      if (!name) {
        alert('אנא הזן את שמך לפני לחיצה על הסטטוס');
        nameInput.focus();
        return;
      }

      card.classList.add('loading');
      messageDiv.style.display = 'none';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // מעקף CORS עבור Google Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, status: status })
        });

        card.classList.remove('loading');
        messageDiv.className = 'success';
        messageDiv.innerHTML = '✅ הדיווח נשלח בהצלחה!';
        messageDiv.style.display = 'block';

        // איפוס השדה לאחר 2 שניות
        setTimeout(() => { nameInput.value = ''; }, 2000);

      } catch (err) {
        card.classList.remove('loading');
        messageDiv.className = 'error';
        messageDiv.innerHTML = '❌ אירעה שגיאה בשליחה. נסה שוב.';
        messageDiv.style.display = 'block';
      }
    }
  </script>

</body>
</html>
