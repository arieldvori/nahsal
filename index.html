<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דיווח נכסל משוב</title>

<style>
*{
    box-sizing:border-box;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

body{
    background:#f3f4f6;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    background:#fff;
    padding:24px;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
    width:100%;
    max-width:400px;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-bottom:16px;
}

.status-buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.btn-green{background:#10b981;}
.btn-blue{background:#3b82f6;}
.btn-gray{background:#6b7280;}

.loading{
    opacity:.6;
    pointer-events:none;
}

#other-container{
    display:none;
    margin-top:12px;
}

#message{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
    display:none;
}

.success{color:green;}
.error{color:red;}
</style>

</head>

<body>

<div class="card" id="form-card">

<h1>📝 דיווח נכסל משוב</h1>

<label>שם מלא</label>
<input id="name" type="text">

<label>חוליה</label>
<input id="squad" type="text">

<label>בחר סטטוס</label>

<div class="status-buttons">

<button class="btn btn-green"
onclick="handleStatusClick('🏠 בבית')">
🏠 בבית
</button>

<button class="btn btn-blue"
onclick="handleStatusClick('🛡️ בבסיס')">
🛡️ בבסיס
</button>

<button class="btn btn-gray"
onclick="toggleOtherInput()">
✏️ אחר
</button>

</div>

<div id="other-container">

<label>פירוט</label>

<input
id="custom-text"
type="text"
placeholder="רשום כאן...">

<button
class="btn btn-green"
onclick="submitCustomStatus()">
שלח דיווח
</button>

</div>

<div id="message"></div>

</div>

<script>

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxIEEbl6eG0B8WhemcoAHgfLJNrL695VVgvdgGKZBL_wYUv8FfiqUWq6TwBUDT5RAvCKA/exec";

function toggleOtherInput(){

    console.log("toggleOtherInput");

    const c=document.getElementById("other-container");

    c.style.display=
    c.style.display==="block"
    ?"none"
    :"block";

}

function handleStatusClick(status){

    console.log("handleStatusClick",status);

    document.getElementById("other-container").style.display="none";

    submitStatus(status);

}

function submitCustomStatus(){

    console.log("submitCustomStatus");

    const text=document.getElementById("custom-text").value.trim();

    console.log("Custom:",text);

    if(text===""){
        alert("רשום סטטוס");
        return;
    }

    submitStatus(text);

}

async function submitStatus(status){

    console.log("submitStatus",status);

    const card=document.getElementById("form-card");
    const message=document.getElementById("message");

    const name=document.getElementById("name").value.trim();
    const squad=document.getElementById("squad").value.trim();

    if(name===""){
        alert("הכנס שם");
        return;
    }

    if(squad===""){
        alert("הכנס חוליה");
        return;
    }

    card.classList.add("loading");
    message.style.display="none";

    try{

        console.log("Sending...");

        const response=await fetch(SCRIPT_URL,{
            method:"POST",
            headers:{
                "Content-Type":"text/plain;charset=utf-8"
            },
            body:JSON.stringify({
                name:name,
                squad:squad,
                status:status
            })
        });

        console.log("HTTP",response.status);

        const txt=await response.text();

        console.log("Server response:");
        console.log(txt);

        let result;

        try{
            result=JSON.parse(txt);
        }
        catch(e){
            throw new Error("השרת לא החזיר JSON:\n"+txt);
        }

        console.log(result);

        card.classList.remove("loading");

        if(result.status==="success"){

            message.className="success";
            message.innerHTML="✅ נשלח";

        }
        else if(result.status==="closed"){

            message.className="error";
            message.innerHTML="🔒 הדיווח סגור";

        }
        else{

            message.className="error";
            message.innerHTML=result.message||"שגיאה";

        }

        message.style.display="block";

    }

    catch(err){

        console.error(err);

        card.classList.remove("loading");

        message.className="error";
        message.innerHTML=err.message;

        message.style.display="block";

    }

}

</script>

</body>
</html>
